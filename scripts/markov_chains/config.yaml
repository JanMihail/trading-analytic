# config.yaml
# Конфигурация нарезки тиков на цепи Маркова

clickhouse:
  host: "localhost"
  port: 9000          # native protocol порт clickhouse-driver (не 8123!)
  user: "admin"
  password: "admin"
  database: "source"

# Символ инструмента. Должна существовать таблица source.tick_data_<symbol>
symbol: "GBPUSD"

# Размер шага нарезки (единицы цены bid). Значение по умолчанию из ТЗ.
threshold: "0.01000"

# Сколько строк исходных тиков читать и копить перед прогоном через ядро
# нарезки. Не влияет на корректность результата (проверено тестами на
# консистентность границ чанков), влияет только на потребление RAM и
# частоту чекпоинтов/вставок.
block_size: 200000

# Сколько накопленных движений (строк tick_moves) копить перед вставкой
# в ClickHouse одним INSERT.
flush_rows: 200000

# Логировать прогресс каждые N обработанных исходных строк
log_every_rows: 5000000
